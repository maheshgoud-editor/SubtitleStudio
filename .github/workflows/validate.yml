name: Validate Subtitle Studio
on:
  push:
    branches: [main, feature/accuracy-transcription]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile app.py
      - run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("frontend-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check frontend-check.js
      - run: test -s static/index.html && test -s requirements.txt
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: subtitle-studio:validation
