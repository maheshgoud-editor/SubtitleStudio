name: Validate Subtitle Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile app.py
      - run: test -s static/index.html && test -s requirements.txt
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: subtitle-studio:validation
