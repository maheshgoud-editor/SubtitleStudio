name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "launcher.py"
      - "static/**"
      - "requirements.txt"
      - "SubtitleStudio.spec"
      - ".github/workflows/build-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build portable Windows app
        run: pyinstaller --noconfirm SubtitleStudio.spec
      - name: Package EXE
        run: Compress-Archive -Path dist/SubtitleStudio/* -DestinationPath SubtitleStudio-Windows.zip
      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleStudio-Windows
          path: SubtitleStudio-Windows.zip
          retention-days: 30
